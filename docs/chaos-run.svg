<svg xmlns="http://www.w3.org/2000/svg" width="860" height="570" viewBox="0 0 860 570" role="img" aria-label="Output of bin/rails chaos:run: every invariant holds">
<title>bin/rails chaos:run — the one rule held</title>
<rect width="860" height="570" rx="10" fill="#0d1117"/>
<rect width="860" height="30" rx="10" fill="#161b22"/><rect y="20" width="860" height="10" fill="#161b22"/>
<circle cx="20" cy="15" r="6" fill="#ff5f57"/><circle cx="40" cy="15" r="6" fill="#febc2e"/><circle cx="60" cy="15" r="6" fill="#28c840"/>
<text x="430" y="19" fill="#8b949e" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">chaos:run — real output, unedited</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<text x="20" y="52" fill="#8b949e" xml:space="preserve"># with 128,787 stuck payments already in the database</text>
<text x="20" y="72" fill="#7ee787" xml:space="preserve">$ docker compose exec web bin/rails &quot;chaos:run[40]&quot;</text>
<text x="20" y="92" fill="#e6edf3" xml:space="preserve">Nordpay is now hostile: timeout=0.15 timeout_seconds=4 flaky_500=0.2</text>
<text x="20" y="112" fill="#e6edf3" xml:space="preserve">duplicate_response=0.2 decline=0.1 webhook_duplicate=0.3 webhook_out_of_order=0.3</text>
<text x="20" y="132" fill="#e6edf3" xml:space="preserve">webhook_late=0.1 webhook_never=0.1 webhook_bad_signature=0.1</text>
<text x="20" y="152" fill="#e6edf3" xml:space="preserve">POST /v1/payments × 120 (40 keys × 3) → 87×202, 33×409</text>
<text x="20" y="172" fill="#8b949e" xml:space="preserve">…payments to leave pending/unknown: 170s</text>
<text x="20" y="192" fill="#e6edf3" xml:space="preserve">capture (2 racing per payment): 66 requests → 33×202, 12×400, 21×409</text>
<text x="20" y="212" fill="#8b949e" xml:space="preserve">…captures to land: 0s</text>
<text x="20" y="232" fill="#e6edf3" xml:space="preserve">refund 60% (3 racing per payment): 99 requests → 33×202, 66×422</text>
<text x="20" y="252" fill="#8b949e" xml:space="preserve">…refunds to settle: 4s</text>
<text x="20" y="272" fill="#3fb950" xml:space="preserve">✓ idempotency: 40 keys created exactly 40 payments</text>
<text x="20" y="292" fill="#3fb950" xml:space="preserve">✓ no orphan PSP charges — 235 new charges, 0 unaccounted for</text>
<text x="20" y="312" fill="#3fb950" xml:space="preserve">✓ money taken by the PSP == money captured in our ledger (40/40 payments)</text>
<text x="20" y="332" fill="#3fb950" xml:space="preserve">✓ refunded ≤ captured (40/40 payments)</text>
<text x="20" y="352" fill="#3fb950" xml:space="preserve">✓ money refunded by the PSP == refunds in our ledger (40/40 payments)</text>
<text x="20" y="372" fill="#3fb950" xml:space="preserve">✓ no refund reservation left once refunds settle (40/40 payments)</text>
<text x="20" y="392" fill="#3fb950" xml:space="preserve">✓ settlement report: 66 lines, 0 not matching the ledger</text>
<text x="20" y="412" fill="#3fb950" xml:space="preserve">✓ every capture fully settled by the PSP (40/40 payments)</text>
<text x="20" y="432" fill="#3fb950" xml:space="preserve">✓ every ledger transfer nets to zero (165 transfers)</text>
<text x="20" y="452" fill="#e6edf3" xml:space="preserve"></text>
<text x="20" y="472" fill="#e6edf3" xml:space="preserve">final states: 7 failed, 33 part_refunded</text>
<text x="20" y="492" fill="#e6edf3" xml:space="preserve">transitions through unknown: 2</text>
<text x="20" y="512" fill="#e6edf3" xml:space="preserve"></text>
<text x="20" y="532" fill="#3fb950" font-weight="700" xml:space="preserve">The one rule held.</text>
</g>
</svg>
