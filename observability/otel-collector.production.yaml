# OpenTelemetry Collector, production. Same shape as otel-collector.yaml
# (traces, logs and metrics all land in ClickHouse); what differs:
#   logs    <- container stdout (production logs to STDOUT), read from Docker's
#              json-file log driver on the host, unwrapped by the `container`
#              operator. Only our request/job JSON lines are kept.
#   metrics <- Prometheus scrape of WEB_METRICS_TARGET and WORKER_METRICS_TARGET
#              as payhub-web / payhub-worker (the same job names as development,
#              so ClickHouse ServiceName is the same everywhere), with
#              METRICS_TOKEN as the bearer token. Unset, /metrics answers 401
#              and `up` is 0.
#   retention: 90 days queryable in ClickHouse (ttl 2160h) and every log line
#              archived to S3 (bucket lifecycle >= 13 months, set on the bucket).
#              PCI DSS 10.5.1: 12 months kept, the last 3 immediately available.
# Every endpoint and secret comes from the environment; see RUNBOOK.md
# "Logs and retention" for the required variables.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  prometheus:
    config:
      scrape_configs:
        - job_name: payhub-web
          scrape_interval: 15s
          metrics_path: /metrics
          authorization:
            credentials: "${env:METRICS_TOKEN}"
          static_configs:
            - targets: ["${env:WEB_METRICS_TARGET}"]
        - job_name: payhub-worker
          scrape_interval: 15s
          metrics_path: /metrics
          authorization:
            credentials: "${env:METRICS_TOKEN}"
          static_configs:
            - targets: ["${env:WORKER_METRICS_TARGET}"]

  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    include_file_path: true
    start_at: end
    operators:
      # Docker's json-file driver wraps each stdout line as
      # {"log":"...","stream":"stdout","time":"..."}; unwrap it to the line.
      # The path is not a Kubernetes one, so no metadata from it.
      - type: container
        format: docker
        add_metadata_from_filepath: false
      # The container ID is the directory name: keep it, so a line can be
      # traced back to the web or worker container that wrote it.
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]+)/'
        parse_to: attributes
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      # Production's Logger::Formatter prefixes each line
      # ("I, [<time> #<pid>]  INFO -- : "), then the tagged-logging tags
      # ([request_id], ActiveJob's tags); keep only lines that end in JSON.
      - type: filter
        expr: 'not (body matches "^([A-Z], \\[[^\\]]*\\] +[A-Z]+ -- [^:]*: )?(\\[[^\\]]*\\] )*\\{")'
      - type: regex_parser
        regex: '^(?:[A-Z], \[[^\]]*\] +[A-Z]+ -- [^:]*: )?(?:\[[^\]]*\] )*(?P<json>\{.*\})\s*$'
        parse_to: attributes
      - type: json_parser
        parse_from: attributes.json
        parse_to: attributes
      - type: remove
        field: attributes.json
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.000Z"
      # Every container on the host is tailed; keep only PayHub's own lines.
      - type: filter
        expr: 'attributes.kind not in ["request", "job"]'
      - type: trace_parser
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
      # Docker's log file carries no container name, so service.name stays
      # "payhub" as in development; container.id tells web from worker.
      - type: add
        field: resource["service.name"]
        value: payhub

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 800
  batch:
    timeout: 5s

exporters:
  clickhouse:
    endpoint: "${env:CLICKHOUSE_ENDPOINT}"
    database: otel
    username: "${env:CLICKHOUSE_USER}"
    password: "${env:CLICKHOUSE_PASSWORD}"
    create_schema: true
    ttl: 2160h
    timeout: 10s
    retry_on_failure:
      enabled: true

  # Credentials come from the AWS default chain (instance role / env).
  awss3:
    s3uploader:
      region: "${env:LOG_ARCHIVE_REGION}"
      s3_bucket: "${env:LOG_ARCHIVE_BUCKET}"
      s3_prefix: payhub/logs
      # 0.111.0 has no s3_partition_format; "hour" writes
      # year=%Y/month=%m/day=%d/hour=%H/ under the prefix.
      s3_partition: hour
    marshaler: otlp_json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    logs:
      receivers: [filelog, otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, awss3]
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
