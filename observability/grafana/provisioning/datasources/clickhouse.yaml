apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: otel
      defaultDatabase: otel
      # Lets Explore's trace and log views find the OpenTelemetry tables.
      traces:
        defaultDatabase: otel
        defaultTable: otel_traces
        otelEnabled: true
      logs:
        defaultDatabase: otel
        defaultTable: otel_logs
        otelEnabled: true
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD} # compose: CLICKHOUSE_PASSWORD, default otel
