      # Percent of server (request) and consumer (job) spans in error: jobs are in the denominator too, so a burst of job failures pages as well as failing requests. Below 20 spans in 5 minutes it reads 0, so one failure at night does not page.
      - uid: payhub-error-spans
        title: "Error rate above 2% (requests and jobs)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "More than 2% of requests and jobs ended in error over 5 minutes. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-error-spans
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT if(count() < 20, 0, 100 * countIf(StatusCode = 'Error') / count()) AS value
                FROM otel.otel_traces
                WHERE ServiceName IN ('payhub-web', 'payhub-worker') AND SpanKind IN ('Server', 'Consumer')
                  AND SpanAttributes['http.route'] NOT IN ('/metrics', '/healthz')
                  AND Timestamp >= now() - INTERVAL 5 MINUTE
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]

      # Duration is in nanoseconds; the value is milliseconds (0 when there were no /v1 requests).
      - uid: payhub-slo-api-p95
        title: "API p95 latency above 300ms"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: ticket
        annotations:
          summary: "The 95th percentile of /v1 request duration was above 300ms over the last 10 minutes. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-slo-api-p95
        notification_settings:
          receiver: payhub-tickets
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT ifNotFinite(quantile(0.95)(Duration) / 1e6, 0) AS value
                FROM otel.otel_traces
                WHERE ServiceName = 'payhub-web' AND SpanKind = 'Server' AND SpanAttributes['http.route'] LIKE '/v1/%'
                  AND Timestamp >= now() - INTERVAL 10 MINUTE
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [300]

      # 1 when payhub_unknown_state_payments stayed above 0 for the whole hour (samples back to at least 55 minutes ago). Stuck-payment alerts page on their own (payhub-stuck-alerts).
      - uid: payhub-slo-outcome
        title: "Payment outcome SLO at risk"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "Payments have stayed in unknown for a whole hour: the payment outcome SLO is burning. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-slo-outcome
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT toFloat64(min(Value) > 0 AND min(TimeUnix) <= now() - INTERVAL 55 MINUTE) AS value
                FROM otel.otel_metrics_gauge
                WHERE MetricName = 'payhub_unknown_state_payments' AND ServiceName = 'payhub-web'
                  AND TimeUnix >= now() - INTERVAL 1 HOUR
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # One row per service, labelled `service`. No `up` row in the last minute (collector down) reads as 0 (ifNull: whatever join_use_nulls is).
      - uid: payhub-scrape-down
        title: "Metrics scrape failing"
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "The collector cannot scrape {{ .Labels.service }}'s /metrics (up = 0, or no scrape at all): its alerts are blind. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-scrape-down
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 60
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT s.service AS service, toFloat64(ifNull(u.up, 0)) AS value
                FROM (SELECT arrayJoin(['payhub-web', 'payhub-worker']) AS service) AS s
                LEFT JOIN (
                  SELECT ServiceName, min(Value) AS up
                  FROM otel.otel_metrics_gauge
                  WHERE MetricName = 'up' AND ServiceName IN ('payhub-web', 'payhub-worker')
                    AND TimeUnix >= now() - INTERVAL 1 MINUTE
                  GROUP BY ServiceName
                ) AS u ON s.service = u.ServiceName
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # The sweepers log every minute, so silence means the pipeline, not a quiet night. Production tags lines payhub-web / payhub-worker, development payhub.
      - uid: payhub-logs-silent
        title: "No PayHub logs for 15 minutes"
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "No PayHub log line reached ClickHouse in 15 minutes: the collector, the log pipeline or the app is down, and the S3 archive has a gap. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-logs-silent
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT count() AS value
                FROM otel.otel_logs
                WHERE ServiceName LIKE 'payhub%'
                  AND TimestampTime >= now() - INTERVAL 15 MINUTE
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # The collector's own metric (otelcol scrape job); the 0.111.0 awss3 exporter has no retry, so every failed record is an archive gap.
      - uid: payhub-archive-upload-failed
        title: "Log archive upload to S3 failed"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "The collector failed to upload log records to the S3 archive: those lines are missing from the archive until backfilled. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-archive-upload-failed
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT sum(rise) AS value
                FROM (
                  SELECT c.TimeUnix AS TimeUnix,
                         if(isNaN(c.prev),
                            if(u.first_up <= c.TimeUnix - INTERVAL 30 SECOND, c.Value, 0),
                            if(c.Value >= c.prev, c.Value - c.prev, c.Value)) AS rise
                  FROM (
                    SELECT ServiceName, ResourceAttributes['service.instance.id'] AS instance, TimeUnix, Value,
                           lagInFrame(Value, 1, nan) OVER (PARTITION BY ServiceName, mapSort(Attributes), mapSort(ResourceAttributes) ORDER BY TimeUnix
                                                           ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS prev
                    FROM otel.otel_metrics_sum
                    WHERE MetricName = 'otelcol_exporter_send_failed_log_records' AND ServiceName = 'otelcol' AND Attributes['exporter'] = 'awss3'
                      AND TimeUnix >= now() - INTERVAL 60 MINUTE - INTERVAL 1 DAY
                  ) AS c
                  INNER JOIN (
                    SELECT ServiceName, ResourceAttributes['service.instance.id'] AS instance, min(TimeUnix) AS first_up
                    FROM otel.otel_metrics_gauge
                    WHERE MetricName = 'up' AND ServiceName = 'otelcol'
                      AND TimeUnix >= now() - INTERVAL 60 MINUTE - INTERVAL 1 DAY
                    GROUP BY ServiceName, instance
                  ) AS u ON c.ServiceName = u.ServiceName AND c.instance = u.instance
                  WHERE c.TimeUnix >= now() - INTERVAL 60 MINUTE
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
