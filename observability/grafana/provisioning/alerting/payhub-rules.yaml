      # Raised by ReconciliationJob (worker).
      - uid: payhub-ledger-imbalance
        title: "Ledger imbalance detected"
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "Reconciliation found a ledger transfer that does not net to zero: a bug, not an operator error."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-ledger-imbalance
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
