      # Raised by StuckPaymentSweeperJob (worker).
      - uid: payhub-stuck-alerts
        title: "Payments stuck in pending or unknown"
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "The sweeper found payments in pending or unknown for more than 15 minutes (alert.stuck_payment in the log)."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-stuck-alerts
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              editorType: sql
