        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: ticket
        annotations:
          summary: "The settlement run found lines that do not match the ledger."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-recon-breaks
        notification_settings:
          receiver: payhub-oncall
