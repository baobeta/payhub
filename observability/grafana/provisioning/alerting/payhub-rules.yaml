# Grafana alert rules, provisioned on boot. Every rule reads ClickHouse (the
# datasource uid `clickhouse`), reduces to the last value and compares it with
# a threshold; severity `page` wakes someone, `ticket` waits for the morning.
# All go to the payhub-oncall contact point (contact-points.yaml). RUNBOOK.md
# "Alerts" maps each uid to what to do.
#
# Counters (otel.otel_metrics_sum) are cumulative per series: the increase over
# a window adds up each sample's rise over the one before it, per series
# (ServiceName, Attributes, ResourceAttributes; mapSort because ClickHouse
# compares maps by key order, which differs between rows of one series). A drop
# is a process restart, counted as the new value. A series with no sample in the
# day before the window is new and counts from 0: a counter only appears on its
# first increment, which max(Value) - min(Value) would miss. A restart whose
# first value is not below the old one is missed.
#
# The SQL uses now(), not Grafana macros, so each query runs as-is in
# clickhouse-client. Grafana expands environment variables in provisioning
# files, so the file has no dollar sign anywhere (the spec checks).
apiVersion: 1

groups:
  - orgId: 1
    name: payhub
    folder: PayHub
    interval: 1m
    rules:
      # Raised by ProcessInboundEventJob (worker).
      - uid: payhub-late-success
        title: "Late success: a PSP succeeded after we failed the payment"
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "A PSP reported success for a payment PayHub had already failed: the customer may be charged for an order the merchant thinks failed."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-late-success
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT sum(if(Value >= prev, Value - prev, Value)) AS value
                FROM (
                  SELECT TimeUnix, Value,
                         lagInFrame(Value, 1, 0) OVER (PARTITION BY ServiceName, mapSort(Attributes), mapSort(ResourceAttributes) ORDER BY TimeUnix
                                                       ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS prev
                  FROM otel.otel_metrics_sum
                  WHERE MetricName = 'payhub_late_success_total' AND ServiceName = 'payhub-worker'
                    AND TimeUnix >= now() - INTERVAL 10 MINUTE - INTERVAL 1 DAY
                )
                WHERE TimeUnix >= now() - INTERVAL 10 MINUTE
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: payhub-psp-never-received
