      # DB-backed gauge: web refreshes it on every scrape, the worker only when its sweeper runs.
      - uid: payhub-stuck-unknown
        title: "Payments in unknown state for 15 minutes"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "Payments have been in unknown, with the PSP's answer not yet known, for 15 minutes. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-stuck-unknown
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT argMax(Value, TimeUnix) AS value
                FROM otel.otel_metrics_gauge
                WHERE MetricName = 'payhub_unknown_state_payments' AND ServiceName = 'payhub-web'
                  AND TimeUnix >= now() - INTERVAL 5 MINUTE
          - refId: B
