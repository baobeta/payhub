# Grafana alert rules, provisioned on boot. Every rule reads ClickHouse (the
# datasource uid `clickhouse`), reduces to the last value and compares it with
# a threshold. Severity `page` goes to the payhub-oncall contact point, which
# wakes someone; `ticket` goes to payhub-tickets, for the day team
# (contact-points.yaml). RUNBOOK.md "Alerts" maps each uid to what to do.
#
# Counters (otel.otel_metrics_sum) are cumulative per series: the increase over
# a window adds up each sample's rise over the one before it, per series
# (ServiceName, Attributes, ResourceAttributes; mapSort because ClickHouse
# compares maps by key order, which differs between rows of one series). A drop
# is a process restart, counted as the new value (a restart whose first value
# is not below the old one is missed).
#
# A series' first sample in the lookback (the window plus a day) has nothing
# before it. A counter only appears on its first increment, so that sample
# counts in full when the collector was already scraping that instance: `up`
# for the same ServiceName and service.instance.id has a sample at least 30s
# older. Otherwise it is a cold start (first collector deploy, a new ClickHouse
# volume, a collector down for over a day): every series appears with `up` in
# the same scrape, and its first value is the baseline, not a rise.
#
# Counter rules wait `for: 1m`; a query error (ClickHouse unreachable) fires
# DatasourceError (execErrState: Error); no rows reads as OK except where
# silence is the incident (scrape-down, logs-silent: Alerting).
#
# The SQL uses now(), not Grafana macros, so each query runs as-is in
# clickhouse-client. Grafana expands environment variables in provisioning
# files, so the file has no dollar sign anywhere (the spec checks).
apiVersion: 1

groups:
  - orgId: 1
    name: payhub
    folder: PayHub
    interval: 1m
    rules:
      # Raised by ProcessInboundEventJob (worker).
      - uid: payhub-late-success
        title: "Late success: a PSP succeeded after we failed the payment"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: page
        annotations:
          summary: "A PSP reported success for a payment PayHub had already failed: the customer may be charged for an order the merchant thinks failed. Value: {{ index .Values \"B\" }}."
          runbook_url: https://github.com/baobeta/payhub/blob/master/RUNBOOK.md#payhub-late-success
        notification_settings:
          receiver: payhub-oncall
          group_by: [alertname, grafana_folder]
          repeat_interval: 4h
        data:
          - refId: A
            datasourceUid: clickhouse
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorType: sql
              queryType: table
              format: 1
              rawSql: |-
                SELECT sum(rise) AS value
                FROM (
                  SELECT c.TimeUnix AS TimeUnix,
                         if(isNaN(c.prev),
                            if(u.first_up <= c.TimeUnix - INTERVAL 30 SECOND, c.Value, 0),
                            if(c.Value >= c.prev, c.Value - c.prev, c.Value)) AS rise
                  FROM (
                    SELECT ServiceName, ResourceAttributes['service.instance.id'] AS instance, TimeUnix, Value,
                           lagInFrame(Value, 1, nan) OVER (PARTITION BY ServiceName, mapSort(Attributes), mapSort(ResourceAttributes) ORDER BY TimeUnix
                                                           ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS prev
                    FROM otel.otel_metrics_sum
                    WHERE MetricName = 'payhub_late_success_total' AND ServiceName = 'payhub-worker'
                      AND TimeUnix >= now() - INTERVAL 10 MINUTE - INTERVAL 1 DAY
                  ) AS c
                  INNER JOIN (
                    SELECT ServiceName, ResourceAttributes['service.instance.id'] AS instance, min(TimeUnix) AS first_up
                    FROM otel.otel_metrics_gauge
                    WHERE MetricName = 'up' AND ServiceName = 'payhub-worker'
                      AND TimeUnix >= now() - INTERVAL 10 MINUTE - INTERVAL 1 DAY
                    GROUP BY ServiceName, instance
                  ) AS u ON c.ServiceName = u.ServiceName AND c.instance = u.instance
                  WHERE c.TimeUnix >= now() - INTERVAL 10 MINUTE
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

