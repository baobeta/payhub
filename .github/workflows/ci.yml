name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payhub
          POSTGRES_PASSWORD: payhub
          POSTGRES_DB: payhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payhub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: payhub
      PGPASSWORD: payhub
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Postgres client matching the server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Prepare database
        run: bin/rails db:create db:schema:load

      # Same gate as `bin/check` locally: zeitwerk, generated files, rubocop, sorbet, frontend, rspec, brakeman.
      - name: Quality gate
        run: bin/check

  # The one rule, end to end: the real compose stack, a hostile PSP simulator,
  # and bin/rails chaos:run checking the ledger against the simulator's own
  # records and settlement report. Slower than the unit gate, so it runs after it.
  chaos:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Prepare database
        run: docker compose exec -T web bin/rails db:prepare

      - name: Wait for the API
        run: timeout 120 bash -c 'until curl -sf localhost:3000/healthz >/dev/null; do sleep 2; done'

      - name: Chaos run
        run: docker compose exec -T web bin/rails "chaos:run[30]"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=300 web worker nordpay
