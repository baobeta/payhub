services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payhub
      POSTGRES_PASSWORD: payhub
      POSTGRES_DB: payhub_development
    ports:
      - "5434:5432" # 5432 is taken on the host; app connects via PGPORT=5434 locally
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    # rm the pid file first: the bind mount preserves it across container
    # restarts, and Puma refuses to boot if it sees one. The metrics files
    # (PROMETHEUS_MULTIPROC_DIR) go too, or a restart keeps the old values.
    command: sh -c "rm -f tmp/pids/server.pid && rm -rf $$PROMETHEUS_MULTIPROC_DIR && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "${WEB_PORT:-3000}:3000" # host port; set WEB_PORT in .env if 3000 is taken
    environment: &app_env
      # The port on YOUR machine (the container always listens on 3000). Links
      # the app prints or emails use it. Set WEB_PORT in .env if 3000 is taken.
      WEB_PORT: ${WEB_PORT:-3000}
      DATABASE_URL: postgres://payhub:payhub@db:5432/payhub_development
      REDIS_URL: redis://redis:6379/0
      NORDPAY_URL: http://nordpay:4001
      NORDPAY_API_KEY: np_test_key
      NORDPAY_WEBHOOK_SECRET: np_whsec_test
      KIRIPAY_URL: http://kiripay:4002
      KIRIPAY_API_KEY: kp_test_key
      KIRIPAY_WEBHOOK_SECRET: kp_whsec_test
      RAILS_ENV: development
      VITE_RUBY_HOST: vite
      # Proxy /vite-dev through Rails: "vite" only resolves inside compose, so
      # the browser must never be sent to http://vite:3036 directly.
      VITE_RUBY_SKIP_PROXY: "false"
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
      # Spans go to the collector (observability/otel-collector.yaml), which
      # stores them in ClickHouse; view them in Grafana on :3300.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: payhub-web
      # Every process writes its metrics here and /metrics adds them up. One
      # directory per service: web and worker share the bind mount, and their
      # PIDs overlap (each container counts from 1). Each is scraped on its
      # own: web on :3000/metrics, worker on :9394/metrics.
      PROMETHEUS_MULTIPROC_DIR: /rails/tmp/prometheus/web
      # Bearer token for /metrics; the collector sends the same one. Empty by
      # default, which leaves /metrics open outside production. Set it in .env
      # to try the production behaviour locally.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - .:/rails
      - /rails/node_modules # keep the image's Linux node_modules, not the host's

  vite:
    build: .
    command: bin/vite dev
    environment:
      VITE_RUBY_HOST: 0.0.0.0
    ports:
      - "3036:3036"
    volumes:
      - .:/rails
      - /rails/node_modules

  worker:
    build: .
    # Wipe the metrics files at start, as web does. exec keeps Sidekiq as PID 1
    # so it still gets the stop signal and shuts down cleanly.
    command: sh -c "rm -rf $$PROMETHEUS_MULTIPROC_DIR && exec bundle exec sidekiq"
    # App env (see &app_env above) plus a key of its own: ChaosRun drives the
    # real HTTP API from a job (D-04), so the demo's chaos button needs to
    # reach the web process, not localhost.
    environment:
      <<: *app_env
      CHAOS_API_URL: ${CHAOS_API_URL:-http://web:3000}
      OTEL_SERVICE_NAME: payhub-worker
      PROMETHEUS_MULTIPROC_DIR: /rails/tmp/prometheus/worker
    # Sidekiq serves its own /metrics here (MetricsExporter), same token rule
    # as web. Not published to the host; from your machine:
    #   docker compose exec worker sh -c 'curl -s -H "Authorization: Bearer $METRICS_TOKEN" localhost:9394/metrics'
    # (the header is only needed once METRICS_TOKEN is set).
    expose:
      - "9394"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - .:/rails
      - /rails/node_modules

  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"   # web inbox
      - "1025:1025"   # SMTP

  # PSP simulators: deliberately unreliable, see simulators/*/failure_config.yml
  nordpay:
    build: ./simulators/nordpay
    ports:
      - "4001:4001"
    environment:
      NORDPAY_API_KEY: np_test_key
      # Where the simulator POSTs its webhooks. Inside compose: the web service.
      # For a locally-run Rails (bin/rails s), override to http://host.docker.internal:3000/v1/webhooks/nordpay
      PAYHUB_WEBHOOK_URL: ${NORDPAY_WEBHOOK_URL:-http://web:3000/v1/webhooks/nordpay}
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'exit Net::HTTP.get_response(URI(\"http://localhost:4001/healthz\")).code == \"200\" ? 0 : 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  kiripay:
    build: ./simulators/kiripay
    ports:
      - "4002:4002"
    environment:
      KIRIPAY_API_KEY: kp_test_key
      KIRIPAY_WEBHOOK_SECRET: kp_whsec_test
      KIRIPAY_PUBLIC_URL: http://localhost:4002
      # Where the simulator POSTs its webhooks. Inside compose: the web service.
      # For a locally-run Rails (bin/rails s), override to http://host.docker.internal:3000/v1/webhooks/kiripay
      PAYHUB_WEBHOOK_URL: ${PAYHUB_WEBHOOK_URL:-http://web:3000/v1/webhooks/kiripay}
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'exit Net::HTTP.get_response(URI(\"http://localhost:4002/healthz\")).code == \"200\" ? 0 : 1'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Observability: traces, logs and metrics in ClickHouse, viewed in Grafana ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP interface, for ad-hoc SQL: curl 'localhost:8123/?user=otel&password=otel' -d 'SELECT 1'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-} # sent on every /metrics scrape
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./log:/var/log/payhub:ro # the JSON request/job lines, shipped as logs
    depends_on:
      clickhouse:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.4.0
      # Local only: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payhub.json
      # Where the contact points POST alerts (provisioning/alerting/
      # contact-points.yaml): pages to payhub-oncall, tickets to payhub-tickets.
      # The defaults go nowhere (connection refused, logged by Grafana); to
      # watch alerts arrive locally, see README "Alerting".
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://localhost:9/payhub-oncall}
      ALERT_TICKET_WEBHOOK_URL: ${ALERT_TICKET_WEBHOOK_URL:-http://localhost:9/payhub-tickets}
    ports:
      - "${GRAFANA_PORT:-3300}:3000" # not 3000: that is the app's default port
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  pgdata:
  clickhouse-data:
  grafana-data:
