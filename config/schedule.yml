# Periodic jobs, loaded by config/initializers/sidekiq.rb via sidekiq-cron.
# All sweepers are idempotent and cheap when there is nothing to do, so a
# one-minute cadence is safe.
stuck_payment_sweeper:
  cron: "* * * * *"
  class: StuckPaymentSweeperJob
  queue: sweepers
  description: "Poll payments stuck in pending/unknown; re-drive pending refunds and orphan webhooks; expire idempotency keys; alert past 15 minutes"

deliver_outbound_events:
  cron: "* * * * *"
  class: DeliverOutboundEventsJob
  queue: sweepers
  description: "Deliver due outbound webhooks with backoff; dead-letter after 8 attempts"

expire_authorizations:
  cron: "7 * * * *"
  class: ExpireAuthorizationsJob
  queue: sweepers
  description: "Void authorization holds nobody captured within 6 days; merchant gets payment.canceled (authorization_expired)"

daily_reconciliation:
  cron: "15 2 * * *"
  class: ReconciliationJob
  queue: sweepers
  description: "Compare ledger and PSP views; flag unbalanced transfers and drifted payments"

settlement_reconciliation:
  cron: "45 3 * * *"
  class: SettlementReconciliationJob
  queue: sweepers
  description: "Ingest yesterday's PSP settlement reports; match every line to the ledger, book matched ones, flag the rest and unsettled captures"

audit_retention:
  cron: "30 4 * * *"
  class: AuditRetentionJob
  queue: sweepers
  description: "Delete audit_events and psp_calls older than 12 months (PCI 10.5.1)"
