# Local dev: Rails runs natively, Postgres runs in docker compose (host port 5434).
# Inside compose, DATABASE_URL overrides host/user/password: web and worker go
# through PgBouncer (its ?advisory_locks=false turns Rails' session advisory
# locks off), and db: tasks use MIGRATION_DATABASE_URL, Postgres itself
# (lib/tasks/direct_database.rake; RUNBOOK "Connection pooling"). The test env
# ignores both (config/application.rb) and uses PGHOST/PGPORT below, which
# Compose sets to db:5432: Postgres itself, never the pool. The pooled
# URL also has prepared_statements=false: with Postgres 16, Rails frees
# statements with SQL DEALLOCATE, which PgBouncer passes to the wrong server
# connection (aborting the transaction). From Postgres 17 (and pg >= 1.6 on
# libpq >= 17) Rails uses the protocol-level Close, which PgBouncer >= 1.21
# tracks; then the flag can go.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST") { "localhost" } %>
  port: <%= ENV.fetch("PGPORT") { 5434 } %>
  username: <%= ENV.fetch("PGUSER") { "payhub" } %>
  password: <%= ENV.fetch("PGPASSWORD") { "payhub" } %>

development:
  <<: *default
  database: payhub_development

test:
  <<: *default
  # Playwright runs the app in the test env against its own database
  # (TEST_DATABASE=payhub_e2e), so its seed never leaks into RSpec's.
  database: <%= ENV.fetch("TEST_DATABASE") { "payhub_test" } %>

production:
  <<: *default
  database: payhub_production
