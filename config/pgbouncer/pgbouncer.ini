; PgBouncer for the local compose stack (docker-compose.yml, service pgbouncer).
; RUNBOOK "Connection pooling" has the rules; README "Configuration" the URLs.
;
; Web and worker connect here (DATABASE_URL, port 6432). Anything that
; migrates or loads the schema connects to Postgres directly
; (MIGRATION_DATABASE_URL, db:5432): see the Rakefile.
;
; No passwords in this file. The image's entrypoint writes
; /etc/pgbouncer/userlist.txt at start from DB_USER / DB_PASSWORD (compose
; passes POSTGRES_PASSWORD, `.env`), in plain text, which is what lets
; PgBouncer answer the client's SCRAM and also log in to Postgres 16 with
; SCRAM (its default password_encryption). An md5 entry could do neither.

[databases]
; Any database name the client asks for, on the compose Postgres, as the
; client's own user.
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; SHOW POOLS / SHOW STATS: psql -h pgbouncer -p 6432 -U payhub pgbouncer
admin_users = payhub
stats_users = payhub

; A server connection goes back to the pool when the client's transaction
; ends. Session state (SET, session advisory locks, LISTEN, WITH HOLD cursors,
; temp tables) does not follow the client: see RUNBOOK "Connection pooling".
pool_mode = transaction

; Server connections per (database, user) pair: the most transactions that
; run at once. Compose runs one Puma process (3 threads, config/puma.rb) and
; one Sidekiq (concurrency 5, config/sidekiq.yml): 1 x 3 + 5 = 8, plus room
; for a console or bin/rails runner. Production: README "Configuration".
default_pool_size = 10
; Extra server connections when a client has waited reserve_pool_timeout.
reserve_pool_size = 2
reserve_pool_timeout = 3
; Client connections PgBouncer accepts: every Active Record pool (web pool 5,
; worker pool 5) plus consoles, with room to spare. Cheap: a client
; connection is a socket, not a Postgres backend.
max_client_conn = 200
; Never more than this to one database, whatever the users: stays well below
; Postgres' max_connections (100), leaving room for the direct connections
; (migrations, psql).
max_db_connections = 40

; Protocol-level prepared statements (PgBouncer >= 1.21) are tracked per
; client and re-prepared on whichever server connection the client gets, so
; Rails keeps prepared_statements: true. Rails' statement cache holds up to
; 1000 per connection (statement_limit); PgBouncer keeps this many per server
; connection and prepares again on a miss.
max_prepared_statements = 500

; Rails sets these on connect. PgBouncer tracks client_encoding, DateStyle,
; TimeZone (Rails' SET timezone TO 'UTC'), standard_conforming_strings and
; application_name per client and replays them on each server connection it
; hands out; IntervalStyle (Rails' SET intervalstyle = iso_8601) is listed
; here so it is tracked too.
track_extra_parameters = IntervalStyle
; Startup parameters some drivers send that PgBouncer would otherwise reject.
; libpq (the pg gem) sends none of them today; listed so a driver or a
; PGOPTIONS change does not break the login.
ignore_startup_parameters = extra_float_digits,options

; server_reset_query (DISCARD ALL) runs only when a client disconnects, and in
; transaction mode not even then (server_reset_query_always = 0): a client
; never owns a server connection across transactions, so there is no session
; to reset. That is why session SETs leak, and why migrations bypass the pool.
server_reset_query = DISCARD ALL
server_reset_query_always = 0
