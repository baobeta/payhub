# TC-M9-1: route→permission fixture.
# Every dashboard, ops, and demo controller#action is mapped to the exact
# permission it requires, or "public" for allow_unauthorized actions.
# Built from the current code via Authorization#authorization_rules.
# Sanity-checked against docs/permissions.md.
#
# Suspicious mappings noted in the test report:
#   ops/api/proposals#index  guarded by ops.payments.read  (a list of proposals
#     uses the read permission for payments; probably intentional since
#     approvers and ops both need to view proposals, but the permission name
#     does not describe the resource)

